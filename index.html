<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trailhead — Compare NZ Bike Shop Prices</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#14271e;--paper:#f4f2e9;--white:#fff;--green:#163e2b;--signal:#f5743c;--muted:#536057;--line:#c7ccc5;--body:'DM Sans',sans-serif;--display:'Space Grotesk',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
button,input{font:inherit;color:inherit;border-radius:0}
button,a,input{-webkit-tap-highlight-color:transparent}
a{color:inherit;text-underline-offset:4px}
button{cursor:pointer}
::selection{background:var(--signal);color:var(--ink)}
:focus-visible{outline:3px solid #cf4b12;outline-offset:4px}
.shell{max-width:1440px;margin:0 auto;padding:0 40px}
.site-header{background:var(--green);color:var(--white);border-bottom:3px solid var(--ink)}
.site-nav{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.wordmark{font:700 34px/1 var(--display);letter-spacing:-2px;text-decoration:none}
.nav-note{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-top:46px;padding-bottom:38px}
h1{font:700 clamp(38px,5.4vw,76px)/1 var(--display);letter-spacing:-.055em;margin:0;text-transform:uppercase}
.intro p{max-width:240px;font-size:16px;line-height:1.5;margin:0 0 3px}
.catalog{padding-bottom:64px}
.controls{border:2px solid var(--ink);background:var(--white)}
.search-bar{display:flex;align-items:center;gap:15px;padding:15px 20px;border-bottom:2px solid var(--ink)}
.search-bar svg{width:22px;height:22px;flex-shrink:0}
.search-bar input{width:100%;min-width:0;background:transparent;border:0;outline:none;font-size:18px;line-height:1.6;padding:0}
.search-bar:focus-within{box-shadow:inset 4px 0 var(--signal)}
.search-bar input::placeholder{color:var(--muted);opacity:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.tab{border:1px solid var(--ink);background:var(--white);padding:9px 13px;font-weight:600;font-size:13px;line-height:1.4;min-height:40px}
.tab.active{color:var(--white);background:var(--ink)}
.result-count{font-size:13px;color:var(--muted);margin:23px 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--ink);border-left:2px solid var(--ink)}
.product-card{display:flex;flex-direction:column;text-align:left;min-width:0;background:var(--white);border:0;border-bottom:2px solid var(--ink);border-right:2px solid var(--ink);padding:23px 24px 0;min-height:216px;position:relative}
.product-card:focus-visible{z-index:1;outline-offset:-5px}
.cat-chip{font-size:11px;line-height:1.4;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.card-main{display:block;padding:22px 0 24px;flex:1}
.brand{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.product-name{display:block;font:700 25px/1.15 var(--display);letter-spacing:-.7px;overflow-wrap:anywhere}
.card-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 0;width:100%;font-size:13px;font-weight:700}
.card-arrow{font-size:22px;line-height:1}
.empty-state{grid-column:1/-1;padding:35px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
footer{border-top:2px solid var(--ink);padding:26px 0;background:var(--ink);color:white;font-size:12px;line-height:1.6}
.footer-inner{display:flex;justify-content:space-between;gap:18px;align-items:center}
.footer-brand{font:700 24px/1 var(--display);letter-spacing:-1px}
footer p{margin:0}
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(10,20,15,.72);display:none;align-items:center;justify-content:center;padding:24px}
.modal-backdrop.open{display:flex}
.modal{width:100%;max-width:800px;max-height:calc(100dvh - 48px);overflow:auto;overscroll-behavior:contain;background:var(--white);border:2px solid var(--ink)}
.modal-head{background:var(--green);color:var(--white);padding:28px 88px 28px 28px;position:relative;border-bottom:2px solid var(--ink)}
.modal-brand{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.modal-title{font:700 clamp(26px,4vw,38px)/1.1 var(--display);letter-spacing:-1px;margin:0;overflow-wrap:anywhere}
.modal-close{position:absolute;right:18px;top:18px;width:44px;height:44px;border:2px solid var(--ink);background:var(--signal);color:var(--ink);font-size:24px;line-height:1}
.modal-body{padding:0 28px 24px}
.status-line{padding:18px 0;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:9px;line-height:1.4}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--green);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.retailer-list{border-top:2px solid var(--ink)}
.retailer-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid var(--line)}
.retailer-name{font-size:17px;font-weight:700;line-height:1.5}
.flag{display:inline-block;background:var(--signal);color:var(--ink);font-size:10px;line-height:1.5;padding:3px 6px;text-transform:uppercase;margin-left:6px;vertical-align:middle;white-space:nowrap}
.stock-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px;overflow-wrap:anywhere}
.out{color:#9b331e}
.price-wrap{text-align:right;min-width:116px}
.price{font:700 26px/1.15 var(--display);letter-spacing:-.7px;white-space:nowrap}
.price.na{font:500 12px/1.4 var(--body);color:var(--muted);max-width:150px;white-space:normal;letter-spacing:0}
.visit-link{display:inline-block;background:var(--ink);color:var(--white);padding:9px 12px;font-size:12px;font-weight:700;text-decoration:none;margin-top:9px;min-height:36px}
.promo-badge{font-size:12px;margin-top:6px;line-height:1.5}
.code{font-weight:700}
.modal-note{margin-top:20px;font-size:12px;line-height:1.5;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:16px}
.retry-btn{flex-shrink:0;border:1px solid var(--ink);background:var(--white);padding:10px 12px;font-size:12px;font-weight:700;min-height:40px}
.notice{padding:12px;border-left:3px solid var(--signal);background:var(--paper);font-size:12px;line-height:1.5;margin-bottom:18px}
.error-box{margin:20px 0 16px;font-size:15px;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(hover:hover){.product-card:hover{background:#f8edcc}.tab:hover:not(.active){background:var(--paper)}.visit-link:hover,.retry-btn:hover{background:var(--signal);color:var(--ink)}.modal-close:hover{background:white}}
@media(min-width:1150px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:850px){.shell{padding-left:24px;padding-right:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{align-items:flex-start}.intro p{max-width:200px;font-size:14px}.product-card{padding-left:20px;padding-right:20px}.product-name{font-size:23px}}
@media(max-width:560px){.shell{padding-left:16px;padding-right:16px}.site-nav{min-height:68px;gap:12px}.wordmark{font-size:28px}.nav-note{font-size:10px;letter-spacing:.5px;max-width:100px;text-align:right;line-height:1.5}.intro{display:block;padding-top:28px;padding-bottom:26px}h1{font-size:42px}.intro p{max-width:none;margin-top:15px;font-size:14px}.search-bar{padding:13px}.search-bar input{font-size:16px}.tabs{padding:9px;gap:5px}.tab{font-size:12px;padding:8px 10px;min-height:38px}.result-count{font-size:12px;margin-top:18px}.grid{grid-template-columns:1fr}.product-card{min-height:168px;padding:17px 18px 0}.card-main{padding:12px 0 17px}.product-name{font-size:25px}.cat-chip{font-size:10px}.card-footer{padding:10px 0}.catalog{padding-bottom:36px}.footer-inner{display:block}.footer-brand{display:block;margin-bottom:10px}.modal-backdrop{padding:10px}.modal{max-height:calc(100dvh - 20px)}.modal-head{padding:23px 70px 23px 18px}.modal-close{right:12px;top:16px}.modal-body{padding:0 18px 18px}.retailer-row{gap:12px;padding:17px 0}.retailer-name{font-size:15px}.price{font-size:23px}.price-wrap{min-width:96px}.flag{display:table;margin:5px 0 0}.modal-note{align-items:flex-start;flex-direction:column}.price.na{max-width:105px}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<header class="site-header" id="top">
  <div class="shell site-nav">
    <a class="wordmark" href="#top" aria-label="Trailhead home">trailhead.</a>
    <span class="nav-note">Compare NZ bike shops</span>
  </div>
</header>
<main id="mainContent">
  <section class="intro shell" aria-labelledby="pageTitle">
    <h1 id="pageTitle">Bikes. Gear.<br>Compare prices.</h1>
    <p>Find your next ride.<br>See prices from NZ retailers.</p>
  </section>
  <section class="catalog shell" id="catalog" aria-label="Product catalog">
    <div class="controls">
      <label class="search-bar" for="searchInput">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg>
        <span class="sr-only">Search products</span>
        <input id="searchInput" type="search" placeholder="Search a bike, brand or product" autocomplete="off" />
      </label>
      <div class="tabs" id="tabs" role="group" aria-label="Filter by category"></div>
    </div>
    <div class="result-count" id="resultCount" role="status" aria-live="polite"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<footer>
  <div class="shell footer-inner">
    <a class="footer-brand" href="#top">trailhead.</a>
    <p>Prices in NZD. Confirm size, stock and final price with the retailer.</p>
  </div>
</footer>
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <button class="modal-close" id="modalClose" aria-label="Close product">×</button>
      <div class="modal-brand" id="modalBrand"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
    </div>
    <div class="modal-body" id="modalBody" aria-live="polite"></div>
  </div>
</div>

<script type="module">
import { RETAILERS, PRODUCTS } from "./lib/catalog.js";
/* ---------------- DATA ---------------- */
const CATEGORIES = [
  { key: "mtb", label: "Mountain Bikes", marker: "circle" },
  { key: "road", label: "Road Bikes", marker: "square" },
  { key: "ebike", label: "E-Bikes", marker: "diamond" },
  { key: "kids", label: "Kids & BMX", marker: "orange" },
  { key: "helmets", label: "Helmets", marker: "square" },
  { key: "apparel", label: "Apparel", marker: "circle" },
  { key: "parts", label: "Parts & Components", marker: "diamond" },
  { key: "accessories", label: "Accessories", marker: "orange" },
  { key: "nutrition", label: "Nutrition", marker: "circle" }
];

/* ---------------- RENDER: TABS ---------------- */
const tabsEl = document.getElementById('tabs');
let activeCat = 'all';
let searchQuery = '';


function renderTabs(){
  const allTab = `<button class="tab ${activeCat==='all' ? 'active':''}" aria-pressed="${activeCat==='all'}" data-cat="all">All products</button>`;
  const rest = CATEGORIES.map(c => `<button class="tab ${activeCat===c.key ? 'active':''}" aria-pressed="${activeCat===c.key}" data-cat="${c.key}">${c.label}</button>`).join('');
  tabsEl.innerHTML = allTab + rest;
  tabsEl.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      activeCat = t.dataset.cat;
      renderTabs();
      renderGrid();
      tabsEl.querySelector?.(`[data-cat="${activeCat}"]`)?.focus();
    });
  });
}

/* ---------------- RENDER: GRID ---------------- */
const gridEl = document.getElementById('grid');
const resultCountEl = document.getElementById('resultCount');

function categoryLabel(key){
  const c = CATEGORIES.find(c => c.key === key);
  return c ? c.label : key;
}


function renderGrid(){
  const q = searchQuery.trim().toLowerCase();
  const filtered = PRODUCTS.filter(p => {
    const matchesCat = activeCat === 'all' || p.cat === activeCat;
    const matchesQ = !q || (p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || categoryLabel(p.cat).toLowerCase().includes(q));
    return matchesCat && matchesQ;
  });

  resultCountEl.textContent = `${filtered.length} product${filtered.length===1?'':'s'} · ${RETAILERS.length} NZ retailers`;

  if(filtered.length === 0){
    gridEl.innerHTML = `<div class="empty-state">No products match that search. Try a different brand or category.</div>`;
    return;
  }

  gridEl.innerHTML = filtered.map(p => `
    <button class="product-card" data-idx="${PRODUCTS.indexOf(p)}">
      <span class="cat-chip">${categoryLabel(p.cat)}</span>
      <span class="card-main">
        <span class="brand">${escapeHtml(p.brand)}</span>
        <span class="product-name">${escapeHtml(p.name)}</span>
      </span>
      <span class="card-footer"><span>Compare prices</span><span class="card-arrow" aria-hidden="true">↗</span></span>
    </button>
  `).join('');

  gridEl.querySelectorAll('.product-card').forEach(card => {
    card.addEventListener('click', () => openModal(PRODUCTS[Number(card.dataset.idx)]));
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderGrid();
});

/* ---------------- MODAL + CACHED PRICES ---------------- */
const modalBackdrop = document.getElementById('modalBackdrop');
const modalBrand = document.getElementById('modalBrand');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

document.getElementById('modalClose').addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (!modalBackdrop.classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Tab') {
    const focusable = [...modalBackdrop.querySelectorAll('button, a[href]')];
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
  }
});

let lookupSequence = 0;
let lookupController;
let returnFocus;

function closeModal(){
  lookupSequence++;
  lookupController?.abort();
  modalBackdrop.classList.remove('open');
  document.body?.classList.remove('modal-open');
  returnFocus?.focus();
}

function openModal(product){
  returnFocus = document.activeElement;
  modalBrand.textContent = product.brand;
  modalTitle.textContent = product.name;
  modalBackdrop.classList.add('open');
  document.body?.classList.add('modal-open');
  document.getElementById('modalClose').focus?.();
  runLookup(product);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function runLookup(product){
  const sequence = ++lookupSequence;
  lookupController?.abort();
  const controller = new AbortController();
  lookupController = controller;
  const timeout = setTimeout(() => controller.abort(), 28000);
  modalBody.innerHTML = `
    <div class="status-line"><span class="spinner"></span> Loading prices…</div>
  `;

  try{
    const response = await fetch("/api/lookup", {
      method: "POST",
      signal: controller.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        brand: product.brand,
        name: product.name,
        catKey: product.cat
      })
    });

    if(!response.ok){
      const failure = await response.json().catch(() => ({}));
      throw new Error(failure.error || 'The price service is temporarily unavailable. Please try again.');
    }

    const parsed = await response.json();
    if (sequence === lookupSequence) renderResults(product, parsed);
  } catch(err){
    if (sequence === lookupSequence) renderError(product, err.name === "AbortError" ? new Error("The lookup timed out. Please try again.") : err);
  } finally {
    clearTimeout(timeout);
  }
}

function safeRetailerUrl(result){
  try {
    const url = new URL(result.url);
    const retailer = RETAILERS.find(r => r.name === result.retailer);
    return retailer && url.protocol === 'https:' && !url.username && !url.password && !url.port &&
      url.hostname.replace(/^www\./, '') === retailer.domain ? url.href : null;
  } catch { return null; }
}


function freshnessLabel(data){
  if (!data.updatedAt) return 'Awaiting price update';
  const mins = Math.round((Date.now() - data.updatedAt) / 60000);
  if (mins < 1) return 'Updated moments ago';
  if (mins < 60) return `Updated ${mins} min ago`;
  const hrs = Math.round(mins / 60);
  return `Updated ${hrs} hour${hrs === 1 ? '' : 's'} ago`;
}

function renderResults(product, data){
  const results = Array.isArray(data.results) ? data.results : [];
  const cheapest = data.cheapest_retailer || null;


  const rows = results.map(r => {
    const isCheapest = cheapest && r.retailer === cheapest;
    const priceKnown = r.status === 'verified' && Number.isFinite(r.price_amount);
    const stockText = r.in_stock === true ? 'In stock' : (r.in_stock === false ? 'Out of stock' : '');
    const url = safeRetailerUrl(r);
    return `
      <div class="retailer-row ${isCheapest ? 'cheapest' : ''}">
        <div class="retailer-name-wrap">
          <div class="retailer-name">${escapeHtml(r.retailer)} ${isCheapest ? '<span class="flag">Lowest price</span>' : ''}</div>
          ${r.product_title ? `<div class="stock-note">${escapeHtml(r.product_title)}</div>` : ''}
          ${r.status === 'unavailable' ? `<div class="stock-note out">Price check unavailable</div>` : ''}
          ${stockText ? `<div class="stock-note ${r.in_stock === false ? 'out' : ''}">${stockText}</div>` : ''}
          ${r.promo_code ? `<div class="promo-badge">CODE <span class="code">${escapeHtml(r.promo_code)}</span></div>` : ''}
          ${(!r.promo_code && r.promo_details) ? `<div class="promo-badge">${escapeHtml(r.promo_details)}</div>` : ''}
        </div>
        <div class="price-wrap">
          <div class="price ${priceKnown ? '' : 'na'}">${escapeHtml(r.price || 'Price unverified')}</div>
          ${url ? `<a class="visit-link" href="${escapeHtml(url).replace(/"/g, '&quot;')}" target="_blank" rel="noopener">Shop →</a>` : ''}
        </div>
      </div>
    `;
  }).join('');

  modalBody.innerHTML = `
    <div class="status-line">${data.pending ? 'Awaiting saved prices' : freshnessLabel(data)}</div>
    ${data.stale ? '<div class="notice">Prices are over six hours old. Check the retailer for updates.</div>' : ''}
    <div class="retailer-list">${rows || '<p class="stock-note">No saved retailer prices yet. Please check back later.</p>'}</div>
    <div class="modal-note">
      <span>Confirm size, stock and final price with the retailer.</span>
      <button class="retry-btn" id="retryBtn">Reload prices</button>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', () => runLookup(product));
}

function renderError(product, err){
  modalBody.innerHTML = `
    <div class="error-box">
      Prices are temporarily unavailable. Try again or visit a retailer.
    </div>
    <div class="retailer-list">
      ${RETAILERS.map(r => `
        <div class="retailer-row">
          <div class="retailer-name-wrap"><div class="retailer-name">${r.name}</div></div>
          <a class="visit-link" href="https://${r.domain}" target="_blank" rel="noopener">Shop →</a>
        </div>
      `).join('')}
    </div>
    <div class="modal-note"><button class="retry-btn" id="retryBtn">Try again</button></div>
  `;
  document.getElementById('retryBtn').addEventListener('click', () => runLookup(product));
}

/* ---------------- INIT ---------------- */
renderTabs();
renderGrid();
</script>

</body>
</html>
